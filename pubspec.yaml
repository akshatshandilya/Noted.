name: noted
description: A calm, private, local-first notes app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    # Bundled (SIL OFL) so the app never fetches fonts over the network.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# Generate launcher icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
   android: true
     ios: false
     image_path: "assets/icon/app_icon.png"
     adaptive_icon_background: "#F4F3EE"
     adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
